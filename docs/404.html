<script>
  // Old or mistyped addresses (capitals, a trailing slash) go to the page they meant.
  (function () {
    var p = location.pathname;
    var n = p.toLowerCase();
    if (n.split("/").filter(Boolean).length > 1) { n = n.replace(/\/+$/, ""); }
    if (n !== p) { location.replace(n + location.search + location.hash); }
  })();
</script>
